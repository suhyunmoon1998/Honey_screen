<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120c22" />
    <title>Offline</title>
    <style>
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #120c22;
        color: #ece7fb;
        overscroll-behavior-y: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(
            circle at 12% -5%,
            rgba(166, 137, 255, 0.28),
            transparent 42%
          ),
          radial-gradient(
            circle at 90% 10%,
            rgba(62, 232, 168, 0.24),
            transparent 38%
          ),
          linear-gradient(180deg, #170f2c 0%, #120c22 55%, #0e091b 100%);
      }
      section {
        max-width: 28rem;
        width: 100%;
        box-sizing: border-box;
        background: linear-gradient(180deg, #251c40 0%, #1d1733 100%);
        border: 1px solid #362a5c;
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(6, 3, 16, 0.55);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: #a99bc9;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Offline</h1>
        <p>
          The app needs a connection to continue. No personal information is
          shown here.
        </p>
      </section>
    </main>
  </body>
</html>
